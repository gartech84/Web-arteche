<style>
/* Todas las medidas salen de la maqueta (1024 px de ancho) y escalan con --u */
:root{
  --u:calc(min(100vw, 66.667vh) / 1024);
  --white:#FFFFFF; --cream:#F3F0EC; --ink:#1E1E1E;
  --font:'Figtree','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme: light;
}
@supports (height:100svh){ :root{ --u:calc(min(100vw, 66.667svh) / 1024); } }
/* Computador (pantalla horizontal): título y subtítulo escalan con el alto de pantalla (--ub); el resto mantiene la escala original */
:root{ --ub:var(--u); }
@media (min-aspect-ratio:1/1){
  :root{ --ub:calc(min(100vw, 100vh, 1126px) / 1024); }
  @supports (height:100svh){ :root{ --ub:calc(min(100vw, 100svh, 1126px) / 1024); } }
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#44617E;color:var(--white);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:4px}

.landing{position:relative;height:100vh;height:100svh;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-2;background:#5F86B0 url('img/portada-vertical.jpg') center top/auto max(100%, calc(var(--u)*1720)) no-repeat}
@media (min-aspect-ratio:1/1){ .bg{background:#8DB6E6 url('img/portada.jpg') center 42%/cover no-repeat} }
.landing::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(8,18,32,.58) 0%,rgba(8,18,32,.5) 36%,rgba(8,18,32,0) 58%)}
.landing::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;z-index:-1;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,.66) 100%)}

.abs{position:absolute;margin:0;white-space:nowrap}

/* Marca */
.brand{left:calc(var(--u)*68);top:calc(var(--u)*53.3);display:block;line-height:1}
.brand .logo{position:absolute;left:0;top:calc(var(--u)*(58 - 53.3));width:calc(var(--u)*52.5);height:calc(var(--u)*53);overflow:visible}
.brand .name{display:block;margin-left:calc(var(--u)*70);font-size:calc(var(--u)*31);line-height:1}
.brand .l{font-weight:300;letter-spacing:.04em}
.brand .b{font-weight:700;letter-spacing:.08em;margin-left:calc(var(--u)*10)}
.brand .role{position:absolute;left:calc(var(--u)*70);top:calc(var(--u)*(95.2 - 53.3));font-size:calc(var(--u)*19);line-height:1;font-weight:300;letter-spacing:.24em}

/* Menú hamburguesa */
.burger{position:absolute;right:calc(var(--u)*64 - 10px);top:calc(var(--u)*54 - 10px);width:calc(var(--u)*52 + 20px);height:calc(var(--u)*30 + 20px);padding:10px;background:none;border:0;cursor:pointer}
.burger i{position:absolute;right:10px;height:1px;background:#fff;display:block}
.burger i:nth-child(1){top:10px;width:calc(var(--u)*49);right:calc(10px + var(--u)*1.5)}
.burger i:nth-child(2){top:calc(10px + var(--u)*14.5);width:calc(var(--u)*25)}
.burger i:nth-child(3){top:calc(10px + var(--u)*29);width:calc(var(--u)*52)}

/* Título y subtítulo */
h1.abs{left:calc(var(--u)*68);top:calc(var(--ub)*176);font-weight:350;font-size:calc(var(--ub)*82);line-height:calc(var(--ub)*90);letter-spacing:-.01em}
h1 .line{display:block;overflow:hidden}
h1 .line span{display:block}
.sub{left:calc(var(--u)*69);top:calc(var(--ub)*382);font-weight:350;font-size:calc(var(--ub)*33);line-height:calc(var(--ub)*45);letter-spacing:.025em}

/* Botones: dos píldoras del mismo tamaño; "Ver proyectos" transparente con borde blanco */
.pill,.link{box-sizing:border-box;width:calc(var(--u)*433);height:calc(var(--u)*88);border-radius:999px;display:flex;align-items:center;padding-left:calc(var(--u)*47);font-size:calc(var(--u)*33);font-weight:400;letter-spacing:.02em}
.pill{background:var(--cream);color:var(--ink)}
.link{border:1.5px solid rgba(255,255,255,.95);background:transparent;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35);transition:background .2s}
.link:hover{background:rgba(255,255,255,.12)}
.link .txt{position:static;line-height:1}
.pill .arrow,.link .arrow{position:absolute;left:calc(var(--u)*(429 - 67));top:calc(var(--u)*(518 - 484));width:calc(var(--u)*27);height:calc(var(--u)*20)}
/* Celular: lado a lado, centrados en la pantalla */
.pill,.link{top:calc(var(--u)*534)}
.pill{left:calc(50vw - var(--u)*(433 + 18))}
.link{left:calc(50vw + var(--u)*18)}
/* Pantallas horizontales casi cuadradas: bajo el texto, alineados a la izquierda */
@media (min-aspect-ratio:1/1){
  .pill,.link{top:calc(var(--ub)*472 + var(--u)*50)}
  .pill,.link{width:calc(var(--u)*480)}
  .pill{left:calc(var(--u)*67)}
  .link{left:calc(var(--u)*(67 + 480 + 36))}
}
/* Computador: apilados sobre el cielo, a la altura de la segunda línea del título */
@media (min-aspect-ratio:3/2){
  .sub{top:calc(var(--ub)*404)}
  .pill,.link{left:55vw;width:calc(var(--u)*480)}
  .pill{top:calc(var(--ub)*286 + (var(--ub)*90 - var(--u)*88) / 2)}
  .link{top:calc(var(--ub)*286 + (var(--ub)*90 - var(--u)*88) / 2 + var(--u)*(88 + 28))}
}
.arrow{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

/* Pie (anclado abajo) */
.place{left:calc(var(--u)*72);bottom:calc(var(--u)*(1536 - 1470));height:calc(var(--u)*30);display:flex;align-items:flex-end;font-size:calc(var(--u)*30);font-weight:350;letter-spacing:.025em;line-height:1}
.place svg{width:calc(var(--u)*21);height:calc(var(--u)*30);fill:#fff;margin-right:calc(var(--u)*24);flex:none}
.place span{position:relative;top:calc(var(--u)*4.6)}
.icons{right:calc(var(--u)*(1024 - 952));bottom:calc(var(--u)*(1536 - 1477));height:calc(var(--u)*45);display:flex;align-items:center}
.icons .sep{width:max(1px,calc(var(--u)*1.2));height:calc(var(--u)*42);background:rgba(255,255,255,.7)}
.icons a{display:flex;align-items:center;justify-content:center;width:calc(var(--u)*44);height:calc(var(--u)*44);position:relative}
.icons a::before{content:"";position:absolute;inset:-8px}   /* área táctil mayor */
.icons .sep + a{margin-left:calc(var(--u)*26)}
.icons a + .sep{margin-left:calc(var(--u)*26)}
.icons svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icons svg .fillp{fill:#fff;stroke:none}

.mail-pop{position:absolute;bottom:calc(100% + var(--u)*26);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:calc(var(--u)*18);
  padding:calc(var(--u)*14) calc(var(--u)*14) calc(var(--u)*14) calc(var(--u)*26);white-space:nowrap;
  background:rgba(14,18,24,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  box-shadow:0 8px 30px rgba(0,0,0,.28);animation:popIn .22s var(--ease) both}
.mail-pop[hidden]{display:none}
.mail-addr{font-size:calc(var(--u)*26);font-weight:400;letter-spacing:.01em;user-select:all;-webkit-user-select:all}
.mail-copy{display:inline-flex;align-items:center;gap:calc(var(--u)*8);min-height:calc(var(--u)*56);padding:0 calc(var(--u)*20);border:0;border-radius:999px;background:var(--cream);color:var(--ink);font:inherit;font-size:calc(var(--u)*24);cursor:pointer;position:relative}
.mail-copy::before{content:"";position:absolute;inset:-6px}
.mail-copy svg{width:calc(var(--u)*24);height:calc(var(--u)*24);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mail-copy .i-ok{display:none}
.mail-copy.done .i-copy{display:none}.mail-copy.done .i-ok{display:block}
.mail-tip{position:absolute;top:100%;left:var(--tip,50%);width:0;height:0;margin-left:max(-7px,calc(var(--u)*-16));border-left:max(7px,calc(var(--u)*16)) solid transparent;border-right:max(7px,calc(var(--u)*16)) solid transparent;border-top:max(7px,calc(var(--u)*14)) solid rgba(14,18,24,.74)}
@keyframes popIn{from{opacity:0;transform:translate(var(--dx,-50%),6px)}to{opacity:1;transform:translate(var(--dx,-50%),0)}}

/* Menú */
.menu{position:fixed;inset:0;z-index:10;background:rgba(12,16,22,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*68);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.menu.open{opacity:1;visibility:visible}
.menu .close{position:absolute;right:calc(var(--u)*64 - 10px);top:calc(var(--u)*58 - 10px);width:calc(var(--u)*40 + 20px);height:calc(var(--u)*40 + 20px);background:none;border:0;cursor:pointer}
.menu .close::before,.menu .close::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:max(1.5px,calc(var(--u)*2));background:#fff;transform:rotate(45deg)}
.menu .close::after{transform:rotate(-45deg)}
.menu nav{display:flex;flex-direction:column;gap:calc(var(--u)*30)}
.menu nav a{font-size:calc(var(--u)*75);font-weight:300;line-height:1.1}
.menu nav a[aria-current="page"]{opacity:.45}

@media (prefers-reduced-motion:no-preference){
  .bg{animation:settle 3.2s var(--ease) both}
  .brand,.burger{animation:fade 1.1s ease both .15s}
  h1 .line span{animation:rise 1.4s var(--ease) both}
  h1 .line:nth-child(1) span{animation-delay:.5s}
  h1 .line:nth-child(2) span{animation-delay:.72s}
  .sub{animation:fade 1.2s ease both 1.1s}
  .pill,.link{animation:fade 1.2s ease both 1.4s}
  .place,.icons{animation:fade 1.1s ease both 1.7s}
  @keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(105%)}to{transform:translateY(0)}}
}

</style>

<body>

  <a class="brand abs" href="/" aria-label="Gonzalo Arteche Arquitecto">

  <div class="place abs"><svg viewBox="0 0 15 21" aria-hidden="true"><path d="M7.5 0A7.5 7.5 0 0 0 0 7.5C0 13 7.5 21 7.5 21S15 13 15 7.5A7.5 7.5 0 0 0 7.5 0zm0 10.3a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg><span>Santiago · Proyectos en todo Chile</span></div>

  <div class="icons abs">
    <span class="sep" aria-hidden="true"></span>
    <a href="https://wa.me/56992511880" aria-label="WhatsApp +56 9 9251 1880" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2.75a9.25 9.25 0 0 0-7.98 13.93L2.75 21.25l4.7-1.23A9.25 9.25 0 1 0 12 2.75z"/><path class="fillp" d="M9.08 7.2c-.2-.44-.4-.45-.59-.46h-.5a.96.96 0 0 0-.7.33c-.24.26-.92.9-.92 2.19s.94 2.54 1.07 2.71c.13.18 1.82 2.9 4.5 3.95 2.22.88 2.67.7 3.15.66.49-.04 1.56-.64 1.78-1.26.22-.62.22-1.15.16-1.26-.07-.11-.24-.18-.51-.31-.27-.13-1.56-.77-1.8-.86-.25-.09-.42-.13-.6.13-.18.27-.69.86-.84 1.04-.15.18-.31.2-.58.07-.27-.13-1.13-.42-2.15-1.33-.8-.71-1.33-1.58-1.49-1.85-.15-.27-.02-.41.12-.54.12-.12.27-.31.4-.47.13-.16.18-.27.27-.45.09-.18.04-.33-.02-.47-.07-.13-.58-1.44-.82-1.95z"/></svg></a>
    <span class="sep" aria-hidden="true"></span>
    <a href="mailto:contacto@artechearquitecto.com" id="mailBtn" role="button" aria-label="Ver correo contacto@artechearquitecto.com" aria-haspopup="dialog" aria-expanded="false" aria-controls="mailPop"><svg viewBox="0 0 30 22"><rect x=".75" y=".75" width="28.5" height="20.5" rx="2"/><path d="M1.5 2l13.5 10L28.5 2"/></svg></a>
    <span class="sep" aria-hidden="true"></span>

        <svg class="i-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>

<script>
(function(){
  var ig=document.getElementById('ig');
  if(ig && /Android/i.test(navigator.userAgent)){
    ig.href='intent://www.instagram.com/_u/gonzalo_arteche_arquitecto/#Intent;package=com.instagram.android;scheme=https;S.browser_fallback_url=https%3A%2F%2Fwww.instagram.com%2Fgonzalo_arteche_arquitecto%2F;end';
  }
  /* Correo: muestra la dirección con opción de copiar */
  var mailBtn=document.getElementById('mailBtn'), pop=document.getElementById('mailPop'),
      copyBtn=document.getElementById('mailCopy'), copyTxt=copyBtn.querySelector('.mail-copy-txt'), ADDR='contacto@artechearquitecto.com';
  function place(){
    pop.style.setProperty('--dx','-50%'); pop.style.transform='translateX(-50%)';
    var r=pop.getBoundingClientRect(), vw=document.documentElement.clientWidth, pad=12, shift=0;
    if(r.right>vw-pad) shift=(vw-pad)-r.right;
    if(r.left+shift<pad) shift=pad-r.left;
    var dx='calc(-50% + '+shift+'px)'; pop.style.setProperty('--dx',dx); pop.style.transform='translateX('+dx+')';
    var m=mailBtn.getBoundingClientRect(), p=pop.getBoundingClientRect();
    pop.style.setProperty('--tip',(m.left+m.width/2-p.left)+'px');
  }
  function openPop(){pop.hidden=false;mailBtn.setAttribute('aria-expanded','true');place();copyBtn.focus({preventScroll:true});}
  function closePop(){pop.hidden=true;mailBtn.setAttribute('aria-expanded','false');copyBtn.classList.remove('done');copyTxt.textContent='Copiar';}
  mailBtn.addEventListener('click',function(e){e.preventDefault();pop.hidden?openPop():closePop();});
  document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&!mailBtn.contains(e.target))closePop();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pop.hidden){closePop();mailBtn.focus();}});
  window.addEventListener('resize',function(){if(!pop.hidden)place();});
  function copied(){copyBtn.classList.add('done');copyTxt.textContent='Copiado';}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=ADDR;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(err){}
    document.body.removeChild(ta);
    if(ok){copied();}else{var s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(document.getElementById('mailAddr'));s.removeAllRanges();s.addRange(rg);copyTxt.textContent='Seleccionado';}
  }
  copyBtn.addEventListener('click',function(){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(ADDR).then(copied,fallback);}else{fallback();}
  });

  var menu=document.getElementById('menu'), burger=document.querySelector('.burger'), close=menu.querySelector('.close');
  function set(o){menu.classList.toggle('open',o);menu.setAttribute('aria-hidden',!o);burger.setAttribute('aria-expanded',o);(o?close:burger).focus();}
  burger.addEventListener('click',function(){set(true)});
  close.addEventListener('click',function(){set(false)});
  menu.addEventListener('keydown',function(e){if(e.key==='Escape')set(false)});
})();
</script>
