<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada | Gonzalo Arteche Arquitecto</title>
<meta name="description" content="La página que buscas no existe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..700&display=swap">
<style>
:root{
  --u:calc(min(100vw, 66.667vh) / 1024);          /* misma escala de cabecera y pie que la landing */
  --navy:#0F1A26; --navy-2:#16222F; --cream:#F3F0EC; --ink:#1E1E1E; --muted:#5C5C5C;
  --on-navy:#C9D1D9; --line-dark:rgba(255,255,255,.16); --line-light:rgba(30,30,30,.16);
  --pad:max(24px, calc(var(--u)*68));
  --font:'Figtree','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme: light;
}
@supports (height:100svh){ :root{ --u:calc(min(100vw, 66.667svh) / 1024); } }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-weight:350;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #6FA3E6;outline-offset:4px}
.wrap{max-width:1600px;margin:0 auto;padding:0 var(--pad)}

/* ---------- Tipografía (misma familia, pesos y tracking que la landing) ---------- */
.label{margin:0 0 clamp(18px,2.4vw,28px);font-size:clamp(11px,.9vw,13px);font-weight:400;letter-spacing:.24em;text-transform:uppercase}
.h1{margin:0;font-weight:350;font-size:clamp(40px,5.2vw,84px);line-height:1.02;letter-spacing:-.015em}
.h2{margin:0;font-weight:350;font-size:clamp(30px,4vw,56px);line-height:1.08;letter-spacing:-.01em}
.lead{margin:0;font-weight:350;font-size:clamp(20px,2.1vw,30px);line-height:1.35;letter-spacing:.005em}
.body{margin:0;font-size:clamp(16px,1.25vw,18px);line-height:1.65;letter-spacing:.01em}
.body + .body{margin-top:1em}

/* ---------- Cabecera (idéntica a la landing) ---------- */
.site-head{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--u)*53) calc(var(--u)*64) 0 calc(var(--u)*68);color:#fff}
.brand{position:relative;display:block;line-height:1;padding-left:calc(var(--u)*70);min-height:calc(var(--u)*58)}
.brand .logo{position:absolute;left:0;top:calc(var(--u)*4.7);width:calc(var(--u)*52.5);height:calc(var(--u)*53)}
.brand .name{display:block;font-size:calc(var(--u)*31);line-height:1}
.brand .l{font-weight:300;letter-spacing:.04em}
.brand .b{font-weight:700;letter-spacing:.08em;margin-left:calc(var(--u)*10)}
.brand .role{display:block;margin-top:calc(var(--u)*(95.2 - 53.3 - 31));font-size:calc(var(--u)*19);line-height:1;font-weight:300;letter-spacing:.24em}
.burger{position:relative;margin:-10px -10px 0 0;width:calc(var(--u)*52 + 20px);height:calc(var(--u)*30 + 20px);padding:10px;background:none;border:0;cursor:pointer}
.burger i{position:absolute;right:10px;height:1px;background:#fff;display:block}
.burger i:nth-child(1){top:10px;width:calc(var(--u)*49);right:calc(10px + var(--u)*1.5)}
.burger i:nth-child(2){top:calc(10px + var(--u)*14.5);width:calc(var(--u)*25)}
.burger i:nth-child(3){top:calc(10px + var(--u)*29);width:calc(var(--u)*52)}

/* ---------- Encabezado: Estudio + foto + datos + cifras ---------- */
.hero{background:var(--navy);color:#fff;padding-bottom:clamp(64px,8vw,120px)}
.page-label{margin:clamp(44px,7vw,110px) 0 clamp(20px,2.4vw,32px);color:var(--on-navy)}
.intro{display:grid;grid-template-columns:1fr;gap:clamp(28px,4vw,64px)}
.portrait{margin:0}
.portrait .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:#2a2a2a}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.intro-info{display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(40px,5vw,72px)}
.person-name{margin:0;font-weight:400;font-size:clamp(19px,1.8vw,27px);line-height:1.15;letter-spacing:-.005em}
.person-role{margin:8px 0 0;font-size:clamp(15px,1.2vw,18px);color:var(--on-navy);letter-spacing:.01em}
.person-cv{list-style:none;margin:clamp(22px,2.4vw,32px) 0 0;padding:0}
.person-cv li{display:grid;grid-template-columns:clamp(84px,7vw,104px) 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line-dark);font-size:clamp(14px,1.1vw,16px);line-height:1.45;color:#E3E8EC}
.person-cv li:last-child{border-bottom:1px solid var(--line-dark)}
.person-cv span{font-weight:500;color:#fff;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:clamp(16px,3vw,40px)}
.stat .n{display:block;font-weight:350;font-size:clamp(22px,3.4vw,56px);line-height:1;letter-spacing:-.01em;white-space:nowrap}
.stat .t{display:block;margin-top:10px;font-size:clamp(13px,1vw,15px);line-height:1.35;color:var(--on-navy)}
@media (min-width:900px){
  .intro{grid-template-columns:5fr 7fr;align-items:stretch}
  .intro-info{padding-bottom:4px}
}

/* ---------- Secciones claras ---------- */
.sec{padding:clamp(72px,9vw,140px) 0}
.sec + .sec{padding-top:0}
.sec .label{color:var(--muted)}
.split{display:grid;grid-template-columns:1fr;gap:clamp(18px,3vw,48px)}
@media (min-width:900px){ .split{grid-template-columns:4fr 8fr} .split .label{margin-top:.6em} }
.rule{border-top:1px solid var(--line-light);padding-top:clamp(28px,3.4vw,48px)}

.quote{margin:0;font-weight:350;font-size:clamp(26px,3.5vw,50px);line-height:1.2;letter-spacing:-.01em;max-width:21em}
.quote-by{margin-top:clamp(20px,2.4vw,32px);font-size:clamp(14px,1.05vw,16px);color:var(--muted)}

.timeline{list-style:none;margin:clamp(36px,4vw,56px) 0 0;padding:0}
.timeline li{display:grid;grid-template-columns:clamp(64px,8vw,120px) 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line-light);font-size:clamp(16px,1.25vw,18px);line-height:1.45}
.timeline li:last-child{border-bottom:1px solid var(--line-light)}
.timeline .y{font-weight:500;letter-spacing:.02em}
.timeline .d small{display:block;margin-top:2px;font-size:.88em;color:var(--muted)}

.services{display:grid;grid-template-columns:1fr;gap:0;margin-top:clamp(8px,1vw,16px)}
.service{padding:clamp(22px,2.4vw,32px) 0;border-top:1px solid var(--line-light);display:grid;grid-template-columns:clamp(40px,4vw,64px) 1fr;gap:12px}
.service:last-child{border-bottom:1px solid var(--line-light)}
.service .num{font-size:clamp(13px,1vw,15px);letter-spacing:.08em;color:var(--muted);padding-top:.55em}
.service h3{margin:0 0 6px;font-weight:400;font-size:clamp(21px,1.9vw,28px);line-height:1.2}
.service p{margin:0;font-size:clamp(15px,1.15vw,17px);line-height:1.55;color:var(--muted)}
@media (min-width:900px){ .services{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(32px,4vw,64px)} .service:nth-last-child(2){border-bottom:1px solid var(--line-light)} }

/* ---------- Manifiesto: cursiva y frase del estudio ---------- */
.lead em{font-style:italic;font-weight:350}

/* ---------- Proceso: diagrama vertical ---------- */
.process{background:var(--navy);color:#fff;padding:clamp(56px,7vw,110px) 0 clamp(80px,10vw,150px)}
.process .label{color:var(--on-navy)}
.process-grid{max-width:1100px}
.process-intro{margin:clamp(16px,2vw,24px) 0 0;font-size:clamp(16px,1.25vw,18px);line-height:1.55;color:var(--on-navy);max-width:22em}

.flow{--rail:clamp(22px,2.2vw,30px);--x:calc(var(--rail) / 2);position:relative;list-style:none;margin:0;padding:0}
.flow-track{position:absolute;left:var(--x);top:10px;bottom:10px;width:1px;background:rgba(255,255,255,.16);transform:translateX(-.5px)}
.flow-fill{position:absolute;left:0;top:0;width:1px;height:100%;background:var(--cream);transform-origin:top;transform:scaleY(var(--p,1))}
.phase{position:relative;padding-left:calc(var(--rail) + clamp(18px,2.4vw,36px))}
.phase + .phase{margin-top:clamp(44px,5vw,72px)}
.phase-head{position:relative;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.phase-dot{position:absolute;left:calc(-1 * (var(--rail) + clamp(18px,2.4vw,36px)) + var(--x));top:.55em;width:var(--rail);height:var(--rail);margin:calc(var(--rail) / -2) 0 0 calc(var(--rail) / -2);border-radius:50%;background:var(--navy);border:1px solid var(--cream);transition:background .5s}
.phase-n{font-size:clamp(11px,.9vw,13px);font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--on-navy)}
.phase-t{margin:0;flex-basis:100%;font-weight:350;font-size:clamp(30px,3.4vw,48px);line-height:1.05;letter-spacing:-.01em}
.steps{list-style:none;margin:clamp(20px,2.4vw,32px) 0 0;padding:0}
.step{position:relative;display:grid;grid-template-columns:clamp(34px,3vw,48px) 1fr;column-gap:12px;padding:clamp(18px,2vw,26px) 0;border-top:1px solid rgba(255,255,255,.12)}
.step-dot{position:absolute;left:calc(-1 * (var(--rail) + clamp(18px,2.4vw,36px)) + var(--x));top:calc(clamp(18px,2vw,26px) + .7em);width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--navy);border:1px solid rgba(255,255,255,.55);transition:background .5s,border-color .5s}
.step-n{grid-row:1 / span 3;padding-top:.35em;font-size:clamp(13px,1vw,15px);letter-spacing:.06em;color:var(--on-navy)}
.step-t{margin:0;font-weight:400;font-size:clamp(20px,1.8vw,26px);line-height:1.2}
.step-d{margin:6px 0 0;font-size:clamp(15px,1.15vw,17px);line-height:1.5;color:var(--on-navy);max-width:34em}
.step-outs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.step-out{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(243,240,236,.35);border-radius:999px;font-size:clamp(12px,.95vw,14px);letter-spacing:.02em;color:var(--cream)}
.step-out::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cream)}
.step-last .step-dot{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--cream);border-color:var(--cream)}
.phase.on .phase-dot{background:var(--cream)}
.step.on .step-dot{background:var(--cream);border-color:var(--cream)}

/* ---------- Metodología: portada y banda de imagen ---------- */
.hero-short{padding-bottom:clamp(56px,8vw,110px)}
.page-title{margin:0;font-weight:350;font-size:clamp(38px,5.4vw,80px);line-height:1.03;letter-spacing:-.015em}
.page-intro{margin:clamp(16px,2vw,26px) 0 0;max-width:34em;font-size:clamp(16px,1.35vw,20px);line-height:1.55;color:#E3E8EC}
.hero-keys{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:clamp(16px,3vw,48px);margin-top:clamp(44px,5vw,72px);padding-top:clamp(24px,3vw,36px);border-top:1px solid var(--line-dark)}
.key .k-n{display:block;font-weight:350;font-size:clamp(28px,3.6vw,56px);line-height:1;letter-spacing:-.01em}
.key .k-t{display:block;margin-top:10px;max-width:11em;font-size:clamp(13px,1vw,15px);line-height:1.35;color:var(--on-navy)}
/* Cabecera con foto (mismo tratamiento que Contacto) */

/* ---------- Llamado final ---------- */
.cta{background:var(--navy);color:#fff;padding:clamp(80px,10vw,150px) 0}
.cta .body{margin-top:clamp(16px,2vw,24px);max-width:30em;color:var(--on-navy)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px clamp(24px,3.5vw,48px);margin-top:clamp(32px,4vw,52px)}
.pill{display:inline-flex;align-items:center;gap:clamp(14px,1.6vw,24px);min-height:clamp(52px,5vw,72px);padding:0 clamp(24px,2.6vw,38px);border-radius:999px;background:var(--cream);color:var(--ink);font-size:clamp(16px,1.5vw,22px);font-weight:400;letter-spacing:.02em;transition:background .2s}
.pill:hover{background:#fff}
.link{display:inline-flex;align-items:center;gap:clamp(12px,1.4vw,20px);min-height:44px;border-bottom:1px solid rgba(255,255,255,.9);font-size:clamp(15px,1.3vw,19px);font-weight:300;letter-spacing:.01em}
.link:hover{border-bottom-color:transparent}
.arrow{width:1.2em;height:.9em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pill:hover .arrow,.link:hover .arrow{transform:translateX(3px)}

/* ---------- Metodología: portada y banda de imagen ---------- */
.hero-short{padding-bottom:clamp(56px,8vw,110px)}

/* ---------- Llamado final ---------- */
.cta{background:var(--navy);color:#fff;padding:clamp(80px,10vw,150px) 0}
.cta .body{margin-top:clamp(16px,2vw,24px);max-width:30em;color:var(--on-navy)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px clamp(24px,3.5vw,48px);margin-top:clamp(32px,4vw,52px)}
.pill{display:inline-flex;align-items:center;gap:clamp(14px,1.6vw,24px);min-height:clamp(52px,5vw,72px);padding:0 clamp(24px,2.6vw,38px);border-radius:999px;background:var(--cream);color:var(--ink);font-size:clamp(16px,1.5vw,22px);font-weight:400;letter-spacing:.02em;transition:background .2s}
.pill:hover{background:#fff}
.link{display:inline-flex;align-items:center;gap:clamp(12px,1.4vw,20px);min-height:44px;border-bottom:1px solid rgba(255,255,255,.9);font-size:clamp(15px,1.3vw,19px);font-weight:300;letter-spacing:.01em}
.link:hover{border-bottom-color:transparent}
.arrow{width:1.2em;height:.9em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pill:hover .arrow,.link:hover .arrow{transform:translateX(3px)}

/* ---------- Servicios: lista grande desplegable ---------- */
.svc-sec{background:var(--navy);color:#fff;padding:clamp(80px,10vw,150px) 0 clamp(64px,8vw,110px)}
.svc-sec .label{color:var(--on-navy)}
.svc-top{display:flex;flex-direction:column}
.svc-list{list-style:none;margin:clamp(40px,5vw,72px) 0 0;padding:0;border-bottom:1px solid var(--line-dark)}
.svc{border-top:1px solid var(--line-dark);transition:background .35s}

<script>
(function(){

  }
  /* Correo: muestra la dirección con opción de copiar */
  var mailBtn=document.getElementById('mailBtn'), pop=document.getElementById('mailPop'),
      copyBtn=document.getElementById('mailCopy'), copyTxt=copyBtn.querySelector('.mail-copy-txt'), ADDR='contacto@artechearquitecto.com';
  function place(){
    pop.style.setProperty('--dx','-50%'); pop.style.transform='translateX(-50%)';
    var r=pop.getBoundingClientRect(), vw=document.documentElement.clientWidth, pad=12, shift=0;
    if(r.right>vw-pad) shift=(vw-pad)-r.right;
    if(r.left+shift<pad) shift=pad-r.left;
    var dx='calc(-50% + '+shift+'px)'; pop.style.setProperty('--dx',dx); pop.style.transform='translateX('+dx+')';
    var m=mailBtn.getBoundingClientRect(), p=pop.getBoundingClientRect();
    pop.style.setProperty('--tip',(m.left+m.width/2-p.left)+'px');
  }
  function openPop(){pop.hidden=false;mailBtn.setAttribute('aria-expanded','true');place();copyBtn.focus({preventScroll:true});}
  function closePop(){pop.hidden=true;mailBtn.setAttribute('aria-expanded','false');copyBtn.classList.remove('done');copyTxt.textContent='Copiar';}
  mailBtn.addEventListener('click',function(e){e.preventDefault();pop.hidden?openPop():closePop();});
  document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&!mailBtn.contains(e.target))closePop();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pop.hidden){closePop();mailBtn.focus();}});
  window.addEventListener('resize',function(){if(!pop.hidden)place();});
  function copied(){copyBtn.classList.add('done');copyTxt.textContent='Copiado';}
  function fallback(){
    var ta=document.createElement('textarea');ta.value=ADDR;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(err){}

    if(ok){copied();}else{var s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(document.getElementById('mailAddr'));s.removeAllRanges();s.addRange(rg);copyTxt.textContent='Seleccionado';}
  }
  copyBtn.addEventListener('click',function(){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(ADDR).then(copied,fallback);}else{fallback();}

<script>
/* Diagrama de proceso: la línea se completa y los puntos se encienden al avanzar */
(function(){
  var flow=document.getElementById('flow'); if(!flow) return;
  var fill=flow.querySelector('.flow-fill'), nodes=flow.querySelectorAll('.phase,.step');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function update(){
    var r=flow.getBoundingClientRect(), vh=window.innerHeight, mark=vh*0.6;
    var p=Math.min(1,Math.max(0,(mark-r.top)/r.height));
    fill.style.setProperty('--p', reduce?1:p);
    nodes.forEach(function(n){
      var d=n.querySelector(':scope > .phase-head .phase-dot, :scope > .step-dot'); if(!d) return;
      n.classList.toggle('on', reduce || d.getBoundingClientRect().top < mark);
    });
  }
  window.addEventListener('scroll',update,{passive:true}); window.addEventListener('resize',update); update();
})();
</script>
<script>
/* Aparición suave de secciones al hacer scroll */
(function(){
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}})},{rootMargin:'0px 0px -10% 0px'});
  els.forEach(function(e){io.observe(e)});
})();
</script>
